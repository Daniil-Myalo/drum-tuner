<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title class="lng-until">Онлайн-тюнер для барабанов</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="CSS/style.css">
</head>
<body>
    <div class="container">
        <h1 class=""><i class="fas fa-drum"></i><span class="lng-title">Тюнер для барабанов</span></h1>
        <div id="startButton"><i class="fas fa-play"></i> Start</div>
        <div id="targetFreqContainer"><span class="lng-frequency">Целевая частота:</span><input type="number" id="targetFreq" value="100"> Hz</div>
        <div id="sensitivityContainer"><span class="lng-sensitivity">Чувствительность микрофона:</span> <input type="range" id="rmsThreshold" min="0.01" max="0.1" step="0.01" value="0.02"> <span id="sensitivityValue">0.02</span></div>
        <div id="frequency">-- Hz</div>
        <div id="progress"><div id="progressBar"></div></div>
        <div id="lugsContainer">
            <!-- Кнопки для лагов -->
        </div>
        <p class="lng-description">Выбери лаг, ударь рядом с ним палочкой и подстрой. Цель: все лаги на одной частоте (введи цель выше). Теперь показывает ноту и позволяет регулировать чувствительность.</p>
        <div id="languageContainer">
            <span class="lng-language">Язык: </span>
            <select class="change-lang">
                <option value="ru">RU</option>
                <option value="en">EN</option>
                <option value="ua">UA</option>
                <!-- Добавь больше опций, если нужно: <option value="es">Español</option> -->
            </select>
        </div>
    </div>
    <script src="JS/lang.js"></script>
    <script src="JS/main.js"></script>
</body>
</html>
