  <rect width="64" height="64" rx="12" fill="#0f172a"></rect>
  <!-- корпус барабана -->
  <ellipse cx="32" cy="32" rx="22" ry="14" fill="#e6eef8"></ellipse>
  <ellipse cx="32" cy="29" rx="22" ry="6" fill="#c9d8ef"></ellipse>
  <!-- обод -->
  <rect x="10" y="18" width="44" height="28" rx="6" fill="none" stroke="#0b1220" stroke-width="2"></rect>
  <ellipse cx="32" cy="28.5" rx="22" ry="6" fill="none" stroke="#0b1220" stroke-width="1.5"></ellipse>
  <!-- шаблон вибрации / индикатор (несколько линий как волнa) -->
  <g transform="translate(8,18)" opacity="0.9" fill="none" stroke="#0b1220" stroke-linecap="round" stroke-width="1.2">
